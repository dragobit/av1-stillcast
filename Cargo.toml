[package]
name = "stillcast"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AV1 bitstream assembler specialized for static-image videos (podcasts, music) using show_existing_frame + long-lived golden references"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "stillcast"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }

[dev-dependencies]
assert_cmd = "2"
