# https://docs.devin.ai/onboard-devin/environment-yaml
initialize: |
  # Rust toolchain + ffmpeg (e2e encode/decode verification) + playwright
  # + player binaries (compat_players.sh) + playwright firefox build
  # (BROWSER=firefox headless seek test)
  command -v cargo >/dev/null || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
  sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg mpv vlc-bin
  pip3 install playwright
  python3 -m playwright install firefox
maintenance: |
  cargo fetch
knowledge:
  - name: lint
    contents: |
      cargo fmt --check && cargo clippy --all-targets -- -D warnings
  - name: test
    contents: |
      cargo test && ./scripts/e2e.sh
  - name: browser-test
    contents: |
      CDP_URL=http://localhost:29229 python3 scripts/browser_seek_test.py examples/demo.mp4
  - name: notes
    contents: |
      ffmpeg provides libaom-av1 (encode) and libdav1d (decode-verify); the e2e
      script builds a still, encodes KF+golden, assembles, and counts
      dav1d-decoded frames.
